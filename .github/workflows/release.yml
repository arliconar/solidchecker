name: Build and Release Multiplatform (Windows, Linux, macOS)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
      - "*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Nombre del tag para la versión (ej. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test_app.py

  build:
    name: Build (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            artifact_name: solidchecker-windows-x64
          - name: Linux (x64)
            os: ubuntu-latest
            artifact_name: solidchecker-linux-x64
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact_name: solidchecker-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run unit tests on target OS
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest test_app.py

      # ------------------ WINDOWS BUILD ------------------
      - name: Build Executable (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name solidchecker --copy-metadata google-api-python-client main.py
          New-Item -ItemType Directory -Force -Path release-pkg
          Copy-Item dist/solidchecker.exe release-pkg/solidchecker-windows-x64.exe
          Compress-Archive -Path dist/solidchecker.exe -DestinationPath release-pkg/solidchecker-windows-x64.zip -Force

      # ------------------ LINUX BUILD ------------------
      - name: Build Executable (Linux)
        if: runner.os == 'Linux'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name solidchecker --copy-metadata google-api-python-client main.py
          mkdir -p release-pkg
          chmod +x dist/solidchecker
          tar -czvf release-pkg/solidchecker-linux-x64.tar.gz -C dist solidchecker

      # ------------------ MACOS BUILD ------------------
      - name: Build Executable (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name solidchecker --copy-metadata google-api-python-client main.py
          mkdir -p release-pkg
          if [ -d "dist/solidchecker.app" ]; then
            cd dist && zip -r ../release-pkg/solidchecker-macos.zip solidchecker.app && cd ..
          else
            cd dist && zip -r ../release-pkg/solidchecker-macos.zip solidchecker && cd ..
          fi

      - name: Upload Platform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-pkg/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-assets
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          body: |
            ## SolidChecker Release

            ### Paquetes disponibles por plataforma:
            - **Windows**: `solidchecker-windows-x64.exe` (ejecutable directo) y `solidchecker-windows-x64.zip`
            - **Linux**: `solidchecker-linux-x64.tar.gz` (binario ejecutable empaquetado)
            - **macOS**: `solidchecker-macos.zip` (App bundle `.app` para macOS)

            *Verificación de integridad en `SHA256SUMS.txt`.*
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
